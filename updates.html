<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miles Smith | Updates</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="mask-icon" href="favicon/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="styles.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>

    <style>
        body {
            font-family: 'Roboto';
            line-height: 1.6;
            margin: 25%;
            margin-top: 7.5%;
            margin-bottom: 7.5%;
            padding: 20px;
            background-color: #fff;
            color: #333;
            text-align: justify;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        main {
            flex: 1;
            width: 100%;
        }

        /* Media query for smaller screens */
        @media screen and (max-width: 768px) {
            body {
                margin: 10%;
                margin-top: 5%;
                margin-bottom: 5%;
            }
        }

        a.smiley {
            position: relative;
            text-decoration: none;
            color: inherit;
            display: inline-block;
        }

        a.smiley::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0em;
            height: 0em;
            border-radius: 50%;
            border: 1px solid transparent;
            transform: translate(-50%, -50%);
            transition: width 1s, height 1s, background-color 1s, opacity 1s;
            z-index: -1;
        }

        a.smiley:hover::before {
            width: 4em;
            height: 4em;
            background-color: #29abe2;
            z-index: -1;
        }
        .redirect {
            /*color: #d4145a;*/
            color: #fff;
            text-decoration: none; /* Remove underline */
            padding: 0 8px;
            position: relative; /* Ensure pseudo-element positions relative to .redirect */
            font-weight: normal; /* Set normal font weight by default */
            transition: font-weight 0.3s ease; /* Add transition for font weight change */
            display: inline-block; /* Ensures elements are treated as blocks with padding */
        }

        .redirect::after {
            content: '';
            position: absolute;
            left: 45%;
            bottom: -5px; /* Adjust positioning to be just below the text */
            width: 0;
            height: 2px; /* Thickness of the underline */
            /*background-color: #d4145a;*/
            background-color: #29abe2;
            transition: width 0.3s ease;
        }

        .redirect:hover::after {
            width: 10%; /* Full width underline on hover */
        }

        .toggle-header {
            cursor: default;
            position: relative;
            padding: 0 8px 5px 8px;
        }

        .toggle-header::after {
            content: '';
            position: absolute;
            left: 8px;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: #29abe2;
            transition: width 0.3s ease;
        }

        .toggle-header:hover::after {
            width: 50px;
        }

        /* ── Post list ── */
        .post-item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            cursor: pointer;
            position: relative;
            padding-bottom: 2px;
            gap: 16px;
        }

        .post-header::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: #29abe2;
            transition: width 0.3s ease;
        }

        .post-header:hover::after {
            width: 50px;
        }

        .post-title {
            font-size: 1rem;
            font-weight: normal;
            margin: 0;
            color: #333;
            flex: 1;
        }

        .post-date {
            font-size: 0.8rem;
            color: #999;
            white-space: nowrap;
            font-family: Georgia;
        }

        .post-arrow {
            font-size: 0.7rem;
            color: #bbb;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .post-item.open .post-arrow {
            transform: rotate(90deg);
        }

        .post-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }

        .post-item.open .post-body {
            max-height: 6000px;
            transition: max-height 0.6s ease-in;
        }

        .post-body-inner {
            padding: 16px 0 8px 0;
            color: #444;
            font-size: 0.95rem;
            line-height: 1.75;
            text-align: left;
        }

        /* Style injected Substack HTML */
        .post-body-inner img {
            max-width: 100%;
            height: auto;
            margin: 12px 0;
        }

        .post-body-inner a {
            color: #d4145a;
            text-decoration: none;
        }

        .post-body-inner a:hover {
            text-decoration: underline;
        }

        .post-body-inner p {
            margin-bottom: 1em;
        }

        .post-body-inner h1,
        .post-body-inner h2,
        .post-body-inner h3 {
            font-weight: normal;
            margin-top: 1.5em;
        }

        .post-body-inner blockquote {
            border-left: 2px solid #29abe2;
            margin-left: 0;
            padding-left: 16px;
            color: #666;
            font-style: italic;
        }

        /* ── Loading / error states ── */
        #feed-status {
            color: #999;
            font-size: 0.9rem;
            padding: 20px 0;
        }

        .substack-note {
            font-size: 0.78rem;
            color: #bbb;
            margin-top: 32px;
            font-family: Georgia;
        }

        .substack-note a {
            color: #bbb;
        }

        .substack-note a:hover {
            color: #29abe2;
        }
    </style>
</head>

<body>
    <main>
        <a href="index.html" style="text-decoration: none; color: inherit; display: block; font-size: 2rem; margin-bottom: 24px;" class="toggle-header">Home</a>

        <h2>Updates</h2>
        <p style="color:#999; font-size:0.9rem; margin-top:-8px;">A glimpse into what I have been up to!</p>

        <div id="feed-status">Loading posts...</div>
        <div id="post-list"></div>

        <p class="substack-note">
            Posts pulled from <a href="https://milesmsmith.substack.com" target="_blank">milesmsmith.substack.com</a>. Subscribe there to get new posts by email.
        </p>
    </main>

    <script>
        const FEED_URL = 'https://milesmsmith.substack.com/feed';
        const PROXY = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(FEED_URL)}&count=30`;

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function stripTracking(html) {
            // Remove Substack pixel/tracking images
            return html.replace(/<img[^>]+substack[^>]+(tracking|pixel)[^>]+>/gi, '');
        }

        async function loadFeed() {
            const status = document.getElementById('feed-status');
            const list = document.getElementById('post-list');

            try {
                const res = await fetch(PROXY);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.status !== 'ok' || !data.items || data.items.length === 0) {
                    status.textContent = 'No posts found.';
                    return;
                }

                status.textContent = '';

                data.items.forEach((item, i) => {
                    const el = document.createElement('div');
                    el.className = 'post-item';

                    const title = item.title || 'Untitled';
                    const date = item.pubDate ? formatDate(item.pubDate) : '';
                    const content = stripTracking(item.content || item.description || '<p>No content available.</p>');

                    el.innerHTML = `
                        <div class="post-header">
                            <span class="post-title">${title}</span>
                            <span class="post-date">${date}</span>
                            <span class="post-arrow">▶</span>
                        </div>
                        <div class="post-body">
                            <div class="post-body-inner">${content}</div>
                        </div>
                    `;

                    el.querySelector('.post-header').addEventListener('click', () => {
                        el.classList.toggle('open');
                    });

                    list.appendChild(el);
                });

            } catch (err) {
                console.error(err);
                status.innerHTML = `Couldn't load posts right now. <a class="redirect" href="https://milesmsmith.substack.com" target="_blank">Read on Substack →</a>`;
            }
        }

        loadFeed();
    </script>
</body>
</html>
