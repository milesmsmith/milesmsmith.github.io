<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miles Smith | Updates</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="styles.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>

    <style>
        body {
            font-family: 'Roboto';
            line-height: 1.6;
            margin: 25%;
            margin-top: 7.5%;
            margin-bottom: 7.5%;
            padding: 20px;
            background-color: #fff;
            color: #333;
            text-align: justify;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        main {
            flex: 1;
            width: 100%;
        }

        /* Media query for smaller screens */
        @media screen and (max-width: 768px) {
            body {
                margin: 10%;
                margin-top: 5%;
                margin-bottom: 5%;
            }
        }

        a.smiley {
            position: relative;
            text-decoration: none;
            color: inherit;
            display: inline-block;
        }

        a.smiley::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0em;
            height: 0em;
            border-radius: 50%;
            border: 1px solid transparent;
            transform: translate(-50%, -50%);
            transition: width 1s, height 1s, background-color 1s, opacity 1s;
            z-index: -1;
        }

        a.smiley:hover::before {
            width: 4em;
            height: 4em;
            background-color: #29abe2;
            z-index: -1;
        }
        .redirect {
            color: #d4145a;
            /*color: #fff;*/
            text-decoration: none; /* Remove underline */
            padding: 0 8px;
            position: relative; /* Ensure pseudo-element positions relative to .redirect */
            font-weight: normal; /* Set normal font weight by default */
            transition: font-weight 0.3s ease; /* Add transition for font weight change */
            display: inline-block; /* Ensures elements are treated as blocks with padding */
        }

        .redirect::after {
            content: '';
            position: absolute;
            left: 45%;
            bottom: -5px; /* Adjust positioning to be just below the text */
            width: 0;
            height: 2px; /* Thickness of the underline */
            /*background-color: #d4145a;*/
            background-color: #29abe2;
            transition: width 0.3s ease;
        }

        .redirect:hover::after {
            width: 10%; /* Full width underline on hover */
        }

        .toggle-header {
            cursor: default;
            position: relative;
            padding: 0 8px 5px 8px;
        }

        .toggle-header::after {
            content: '';
            position: absolute;
            left: 8px;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: #29abe2;
            transition: width 0.3s ease;
        }

        .toggle-header:hover::after {
            width: 50px;
        }

        /* ── Post list ── */
        .post-item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            cursor: pointer;
            position: relative;
            padding-bottom: 2px;
            gap: 16px;
        }

        .post-header::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: #29abe2;
            transition: width 0.3s ease;
        }

        .post-header:hover::after {
            width: 50px;
        }

        .post-title {
            font-size: 1rem;
            font-weight: normal;
            margin: 0;
            color: #333;
            flex: 1;
        }

        .post-date {
            font-size: 0.8rem;
            color: #999;
            white-space: nowrap;
            font-family: Georgia;
        }

        .post-arrow {
            font-size: 0.7rem;
            color: #bbb;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .post-item.open .post-arrow {
            transform: rotate(90deg);
        }

        .post-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }

        .post-item.open .post-body {
            max-height: 6000px;
            transition: max-height 0.6s ease-in;
        }

        .post-body-inner {
            padding: 16px 0 8px 0;
            color: #444;
            font-size: 0.95rem;
            line-height: 1.75;
            text-align: left;
        }

        /* Style injected Substack HTML */
        .post-body-inner img {
            max-width: 100%;
            height: auto;
            margin: 12px 0;
        }

        .post-body-inner a {
            color: #d4145a;
            text-decoration: none;
        }

        .post-body-inner a:hover {
            text-decoration: underline;
        }

        .post-body-inner p {
            margin-bottom: 1em;
        }

        .post-body-inner h1,
        .post-body-inner h2,
        .post-body-inner h3 {
            font-weight: normal;
            margin-top: 1.5em;
        }

        .post-body-inner blockquote {
            border-left: 2px solid #29abe2;
            margin-left: 0;
            padding-left: 16px;
            color: #666;
            font-style: italic;
        }

        /* ── Loading / error states ── */
        #feed-status {
            color: #999;
            font-size: 0.9rem;
            padding: 20px 0;
        }

        .substack-note {
            font-size: 0.78rem;
            color: #bbb;
            margin-top: 32px;
            font-family: Georgia;
        }

        .substack-note a {
            color: #bbb;
        }

        .substack-note a:hover {
            color: #29abe2;
        }

        /*
        =================================================
        RSS FEED
        =================================================
        */

        .rss_container{
        background-color: #d0e3e4; /* Update to match your accent color */

        }
        .post{
        position:relative;
        max-height:250px;
        overflow:hidden;
        }
        .post_image_wrapper{
        background-color:#30bdb6;
        height:100%;
        width:100%;
        }
        .post img{
        width:100%;;
        margin-top:-44px;
        }
        .link_with_image img{
        filter: brightness(40%);
        transition:.2s;
        }
        .link_with_image:hover img{
        filter: brightness(60%);
        }
        .post_meta_data{
        position:absolute;
        top:0;
        width:90%;
        height:100%;
        padding:25px;
        }
        .post h3{
        color:#FFF;
        text-decoration:none;
        font-size:22px;
        line-height: 1;
        opacity:.9
        }
        .post p{
        color:#FFF;
        opacity:.7;
        overflow: hidden;
        }

    </style>
</head>

<body>
    <main>
        <a href="index.html" style="text-decoration: none; color: inherit; display: block; font-size: 2rem; margin-bottom: 24px;" class="toggle-header">Home</a>

        <h2>Updates</h2>
        <p style="color:#999; font-size:0.9rem; margin-top:-8px;">A glimpse into what I have been up to!</p>

        <div id="latest-posts" class="row">
            Loading latest post...
        </div>
    </main>

    <script>
        const feedUrl = "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fmilesmsmith.substack.com%2Ffeed%2F"
        
        async function fetchLatestPosts() {
        try {
            const response = await fetch(feedUrl);
            const data = await response.json();

            // Get up to three items from the feed
            const latestItems = (data.items || []).slice(0, 10);

            if (latestItems.length > 0) {
            const postsHTML = latestItems.map(item => {
                // Assuming the first image in the content is the featured image
                const imageUrlMatch = item.content.match(/<img src="([^"]+)"/);
                const imageUrl = imageUrlMatch ? imageUrlMatch[1] : ''; // Default to empty if no image found

                // Extract title and subtitle (assuming subtitle is in the description)
                const title = item.title;
                const subtitle = item.description || 'No Subtitle Provided';

                return `
                <div class="post col-md-4 my-4">
                    <a href="${item.link}" class="link_with_image" target="_blank">
                    <div class="post_image_wrapper">
                        ${imageUrl ? `<img src="${imageUrl}" alt="${title}" class="featured-image">` : ''}
                    </div>
                    <div class="post_meta_data">
                        <h3>${title}</h3>
                        <p><strong>${subtitle}</strong></p>
                    </div>
                    </a>
                </div>
                `;
            }).join('');

            // Update HTML with the latest posts details
            document.getElementById('latest-posts').innerHTML = postsHTML;
            } else {
            document.getElementById('latest-posts').textContent = 'No posts available.';
            }
        } catch (error) {
            document.getElementById('latest-posts').textContent = 'Failed to load the latest posts.';
            console.error('Error fetching the RSS feed:', error);
        }
        }

        fetchLatestPosts();
    </script>

</body>
</html>
